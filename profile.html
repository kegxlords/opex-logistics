<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Profile · Tranex</title>
<meta name="theme-color" content="#0F1216">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/theme.css?v=4">
<link rel="stylesheet" href="assets/css/layout.css?v=4">
<link rel="stylesheet" href="assets/css/components.css?v=4">
<style>
  .p-hero{text-align:center;padding:26px 18px;border-radius:var(--r-lg);background:var(--g-money);color:#fff;box-shadow:var(--sh-blue);margin-bottom:16px;position:relative;overflow:hidden}
  .p-hero::after{content:'';position:absolute;left:-40px;bottom:-60px;width:190px;height:190px;border-radius:50%;background:radial-gradient(circle,rgba(236,46,134,.5),transparent 70%)}
  .p-avatar{width:82px;height:82px;border-radius:50%;margin:0 auto 12px;display:grid;place-items:center;font-family:var(--font-display);font-size:32px;font-weight:800;background:rgba(255,255,255,.2);border:3px solid rgba(255,255,255,.45);position:relative}
  .p-hero h2{color:#fff;position:relative;font-size:21px}
  .p-hero p{position:relative;font-size:12.5px;opacity:.9;font-weight:600}
  .p-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:16px}
  .p-stat{padding:15px 8px;border-radius:var(--r-md);text-align:center;background:var(--surface);border:1px solid var(--hairline);box-shadow:var(--sh-1)}
  .p-stat .k{font-size:9.5px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;color:var(--muted-2)}
  .p-stat .v{font-family:var(--font-display);font-size:16px;font-weight:800;margin-top:3px;letter-spacing:-.02em}
  .dir{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
  .dir a{display:flex;align-items:center;gap:11px;padding:14px 12px;border-radius:var(--r-md);background:var(--surface);border:1px solid var(--hairline);box-shadow:var(--sh-1);font-size:13px;font-weight:800;color:var(--body);transition:transform var(--t-fast) var(--e-spring),box-shadow var(--t-fast),border-color var(--t-fast)}
  .dir a:hover{transform:translateY(-3px);box-shadow:var(--sh-2);border-color:var(--blue-tint-2);color:var(--body)}
  .dir a i{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;color:#fff;flex-shrink:0}
  .dir a i svg{width:17px;height:17px}
  .dir a.danger{color:var(--red)}
</style>
<link rel="stylesheet" href="assets/css/tranex.css?v=1">
</head>
<body data-page="profile">
<div class="boot" id="boot"><div class="boot-in">
  <div class="boot-ring"><span class="crest-mark"><svg viewBox="0 0 40 40" role="img" aria-label="Tranex dispatch mark"><path d="M8 8h24v24H8z" fill="none" stroke="#FFB020" stroke-width="2.4"/><path d="M13 14h14M20 14v13" fill="none" stroke="#FFB020" stroke-width="2.6" stroke-linecap="square"/><path d="M15 27h10" fill="none" stroke="#17C3B2" stroke-width="2.2"/></svg></span></div>
  <div class="boot-txt">Dispatch sync</div>
</div></div>

<div class="app">
  <header id="hdr"></header>
  <main class="main">
    <div id="hero" class="rise rise-1"></div>
    <div class="p-stats rise rise-2" id="stats"></div>

    <div class="card rise rise-3" style="margin-bottom:16px">
      <h3 style="margin-bottom:10px">Account details</h3>
      <div id="details"></div>
      <button class="btn btn--ghost btn--sm btn--block" type="button" id="editPhone" style="margin-top:12px">Update phone number</button>
    </div>

    <h3 class="rise rise-4" style="margin-bottom:12px">All pages</h3>
    <div class="dir rise rise-4" id="dir" style="margin-bottom:16px"></div>

    <div class="card rise rise-5">
      <h3 style="margin-bottom:10px">Community &amp; care</h3>
      <div class="welcome-actions" id="community"></div>
    </div>
  </main>
  <nav id="nav"></nav>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="assets/js/config.js?v=4"></script>
<script src="assets/js/store.js?v=4"></script>
<script src="assets/js/app.js?v=4"></script>
<script src="assets/js/actions.js?v=3"></script>
<script src="assets/js/network.js?v=3"></script>
</body>
</html>
