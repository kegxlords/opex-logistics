<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>My Leases · Opex Logistics</title>
<meta name="theme-color" content="#0F1216">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/theme.css?v=4">
<link rel="stylesheet" href="assets/css/layout.css?v=4">
<link rel="stylesheet" href="assets/css/components.css?v=4">
<style>
  .chips{display:flex;gap:7px;overflow-x:auto;padding-bottom:8px;margin-bottom:14px}
  .lease-grid{display:grid;gap:14px}
  @media(min-width:760px){.lease-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
  .lease-hero{background:var(--g-money);color:#fff;border-radius:var(--r-lg);padding:20px;box-shadow:var(--sh-blue);margin-bottom:18px}
  .lease-hero .k{font-size:10.5px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;opacity:.85}
  .lease-hero .big{font-family:var(--font-display);font-size:32px;font-weight:800;letter-spacing:-.03em;line-height:1.1}
  .lease-hero-row{display:flex;gap:16px;flex-wrap:wrap;margin-top:14px;padding-top:14px;border-top:1px solid rgba(255,255,255,.22)}
  .lease-hero-row div{flex:1;min-width:96px}
  .lease-hero-row b{font-family:var(--font-display);font-size:17px;font-weight:800;display:block}
  .lease-hero-row span{font-size:10.5px;font-weight:700;opacity:.85}
</style>
<link rel="stylesheet" href="assets/css/tranex.css?v=4">
</head>
<body data-page="rents">
<div class="boot" id="boot"><div class="boot-in">
  <div class="boot-ring"><span class="crest-mark"><svg viewBox="0 0 40 40" role="img" aria-label="Opex Logistics dispatch mark"><path d="M8 8h24v24H8z" fill="none" stroke="#FFB020" stroke-width="2.4"/><path d="M13 14h14M20 14v13" fill="none" stroke="#FFB020" stroke-width="2.6" stroke-linecap="square"/><path d="M15 27h10" fill="none" stroke="#17C3B2" stroke-width="2.2"/></svg></span></div>
  <div class="boot-txt">Dispatch sync</div>
</div></div>

<div class="app">
  <header id="hdr"></header>
  <main class="main">
    <div class="rise rise-1" style="margin-bottom:16px">
      <span class="eyebrow">Fleet / active routes</span>
      <h1>My Fleet</h1>
    </div>
    <div id="hero" class="rise rise-2"></div>
    <div class="chips rise rise-3" id="filters"></div>
    <div class="lease-grid rise rise-4" id="list"></div>
  </main>
  <nav id="nav"></nav>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="assets/js/config.js?v=4"></script>
<script src="assets/js/store.js?v=5"></script>

<script src="assets/js/rents.js?v=5"></script>
</body>
</html>
