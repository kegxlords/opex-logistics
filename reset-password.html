<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>New Password · CSC Apartments</title>
<meta name="theme-color" content="#14A867">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/theme.css?v=3">
<link rel="stylesheet" href="assets/css/layout.css?v=3">
<link rel="stylesheet" href="assets/css/components.css?v=3">
</head>
<body data-page="reset">

<div class="boot" id="boot"><div class="boot-in">
  <div class="boot-ring"><span class="crest-mark"><svg viewBox="0 0 40 40"><path d="M20 4 L34 13 V36 H6 V13 Z" fill="none" stroke="#fff" stroke-width="2.4"/><rect x="12" y="19" width="6" height="6" fill="#FFD9EC"/><rect x="22" y="19" width="6" height="6" fill="#fff"/></svg></span></div>
  <div class="boot-txt">CSC</div>
</div></div>

<main class="main main--auth">
  <div class="auth-hero" id="hero"></div>

  <div class="auth-wrap">
    <section class="auth-card rise rise-1">
      <h1 class="auth-title">Set New Password</h1>
      <p class="auth-sub">Choose something strong and memorable</p>

      <div class="alert" id="alert" role="status" aria-live="polite"></div>

      <form id="resetForm" novalidate>
        <div class="field-row">
          <label class="label" for="password">New Password</label>
          <div class="input-wrap">
            <svg viewBox="0 0 24 24" fill="currentColor"><rect x="4" y="10" width="16" height="11" rx="2.5"/><path d="M8 10V7a4 4 0 0 1 8 0v3" fill="none" stroke="currentColor" stroke-width="2.2"/></svg>
            <input class="input" id="password" type="password" autocomplete="new-password" placeholder="Min 6 characters" required>
            <button class="eye" type="button" data-eye="password">Show</button>
          </div>
          <div class="strength" id="meter"><i></i><i></i><i></i><i></i></div>
        </div>
        <div class="field-row">
          <label class="label" for="confirm">Confirm Password</label>
          <div class="input-wrap">
            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M20 6L9 17l-5-5" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
            <input class="input" id="confirm" type="password" autocomplete="new-password" placeholder="Repeat password" required>
            <button class="eye" type="button" data-eye="confirm">Show</button>
          </div>
        </div>
        <button class="btn btn--green btn--block" type="submit">Update Password</button>
      </form>

      <p class="auth-foot"><a href="index.html">Back to Sign In</a></p>
    </section>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="assets/js/config.js?v=4"></script>
<script src="assets/js/store.js?v=4"></script>
<script src="assets/js/app.js?v=3"></script>
<script src="assets/js/auth.js?v=4"></script>
</body>
</html>
