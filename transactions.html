<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Transactions · Tranex</title>
<meta name="theme-color" content="#0F1216">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/theme.css?v=4">
<link rel="stylesheet" href="assets/css/layout.css?v=4">
<link rel="stylesheet" href="assets/css/components.css?v=4">
<style>
  .chips{display:flex;gap:7px;overflow-x:auto;padding-bottom:9px;margin-bottom:12px}
  .sum-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:16px}
  .sum{padding:14px 10px;border-radius:var(--r-md);text-align:center;background:var(--surface);border:1px solid var(--hairline);box-shadow:var(--sh-1)}
  .sum .k{font-size:9.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted-2)}
  .sum .v{font-family:var(--font-display);font-size:17px;font-weight:800;margin-top:3px;letter-spacing:-.02em}
  .toolbar{display:flex;gap:9px;margin-bottom:12px}
  .toolbar .input-wrap{flex:1}
</style>
<link rel="stylesheet" href="assets/css/tranex.css?v=4">
</head>
<body data-page="transactions">
<div class="boot" id="boot"><div class="boot-in">
  <div class="boot-ring"><span class="crest-mark"><svg viewBox="0 0 40 40" role="img" aria-label="Tranex dispatch mark"><path d="M8 8h24v24H8z" fill="none" stroke="#FFB020" stroke-width="2.4"/><path d="M13 14h14M20 14v13" fill="none" stroke="#FFB020" stroke-width="2.6" stroke-linecap="square"/><path d="M15 27h10" fill="none" stroke="#17C3B2" stroke-width="2.2"/></svg></span></div>
  <div class="boot-txt">Dispatch sync</div>
</div></div>

<div class="app">
  <header id="hdr"></header>
  <main class="main">
    <div class="rise rise-1" style="margin-bottom:16px">
      <span style="font-size:10px;font-weight:800;letter-spacing:.18em;text-transform:uppercase;color:var(--pink);display:block">Account ledger</span>
      <h1>Transaction History</h1>
    </div>

    <div class="sum-grid rise rise-2" id="sums"></div>

    <div class="toolbar rise rise-3">
      <div class="input-wrap">
        <svg viewBox="0 0 24 24" fill="currentColor"><circle cx="11" cy="11" r="7" fill="none" stroke="currentColor" stroke-width="2"/><path d="M16.5 16.5L21 21" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        <input class="input" id="search" placeholder="Search description or reference">
      </div>
      <button class="btn btn--ghost btn--sm" type="button" id="export">Export</button>
    </div>

    <div class="chips rise rise-3" id="chips"></div>

    <div class="card rise rise-4"><div class="rows" id="list"></div></div>
  </main>
  <nav id="nav"></nav>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="assets/js/config.js?v=4"></script>
<script src="assets/js/store.js?v=5"></script>
<script src="assets/js/app.js?v=6"></script>
<script src="assets/js/actions.js?v=3"></script>
<script src="assets/js/transactions.js?v=4"></script>
</body>
</html>
