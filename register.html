<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Create Account · Tranex</title>
<meta name="theme-color" content="#0F1216">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/theme.css?v=4">
<link rel="stylesheet" href="assets/css/layout.css?v=4">
<link rel="stylesheet" href="assets/css/components.css?v=4">
<link rel="stylesheet" href="assets/css/tranex.css?v=3">
</head>
<body data-page="register">

<div class="boot" id="boot"><div class="boot-in">
  <div class="boot-ring"><span class="crest-mark"><svg viewBox="0 0 40 40" role="img" aria-label="Tranex dispatch mark"><path d="M8 8h24v24H8z" fill="none" stroke="#FFB020" stroke-width="2.4"/><path d="M13 14h14M20 14v13" fill="none" stroke="#FFB020" stroke-width="2.6" stroke-linecap="square"/><path d="M15 27h10" fill="none" stroke="#17C3B2" stroke-width="2.2"/></svg></span></div>
  <div class="boot-txt">Dispatch sync</div>
</div></div>

<main class="main main--auth">
  <div class="auth-hero" id="hero"></div>

  <div class="auth-wrap">
    <section class="auth-card rise rise-1">
      <span class="eyebrow register-kicker">Tranex / crew access</span>
      <h1 class="auth-title grad-text">Create your access pass.</h1>
      <p class="auth-sub">Set up your dispatch account with an email and password. Add a crew invitation code if you have one.</p>

      <div class="alert" id="alert" role="status" aria-live="polite"></div>

      <form id="regForm" novalidate>
        <div class="field-row">
          <label class="label" for="email">Email / operator ID</label>
          <div class="input-wrap">
            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M2 5h20v14H2zm0 0l10 8L22 5" fill="none" stroke="currentColor" stroke-width="2"/></svg>
            <input class="input" id="email" type="email" autocomplete="email" placeholder="you@example.com" required>
          </div>
        </div>

        <div class="field-row">
          <label class="label" for="password">Account passphrase</label>
          <div class="input-wrap">
            <svg viewBox="0 0 24 24" fill="currentColor"><rect x="4" y="10" width="16" height="11" rx="2.5"/><path d="M8 10V7a4 4 0 0 1 8 0v3" fill="none" stroke="currentColor" stroke-width="2.2"/></svg>
            <input class="input" id="password" type="password" autocomplete="new-password" placeholder="Min 6 characters" required>
            <button class="eye" type="button" data-eye="password">Show</button>
          </div>
          <div class="strength" id="meter"><i></i><i></i><i></i><i></i></div>
        </div>

        <div class="field-row">
          <label class="label" for="invite">Crew invitation code <span class="opt">(optional)</span></label>
          <div class="input-wrap">
            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M3 7h18v4a2 2 0 0 0 0 4v4H3v-4a2 2 0 0 0 0-4zm6 1v8" fill="none" stroke="currentColor" stroke-width="2"/></svg>
            <input class="input input--code" id="invite" placeholder="PNCXXX" maxlength="12">
          </div>
        </div>

        <button class="btn btn--primary btn--block" type="submit">Create access pass</button>
      </form>

      <p class="auth-foot">Already a resident? <a href="index.html">Sign In</a></p>
      <div class="auth-bonus">🎁 New members receive <b id="bonusAmt">₦500.00</b> welcome bonus instantly.</div>
    </section>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="assets/js/config.js?v=4"></script>
<script src="assets/js/store.js?v=5"></script>
<script src="assets/js/app.js?v=6"></script>
<script src="assets/js/auth.js?v=5"></script>
</body>
</html>
