<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Deposit · Tranex</title>
<meta name="theme-color" content="#0F1216">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/theme.css?v=4">
<link rel="stylesheet" href="assets/css/layout.css?v=4">
<link rel="stylesheet" href="assets/css/components.css?v=4">
<style>
  .quick-amts{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
  .bal-strip{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--g-money);color:#fff;border-radius:var(--r-lg);padding:16px 18px;box-shadow:var(--sh-blue);margin-bottom:16px}
  .bal-strip .k{font-size:10.5px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;opacity:.85}
  .bal-strip .v{font-family:var(--font-display);font-size:26px;font-weight:800;letter-spacing:-.03em}
</style>
<link rel="stylesheet" href="assets/css/tranex.css?v=2">
</head>
<body data-page="deposit">
<div class="boot" id="boot"><div class="boot-in">
  <div class="boot-ring"><span class="crest-mark"><svg viewBox="0 0 40 40" role="img" aria-label="Tranex dispatch mark"><path d="M8 8h24v24H8z" fill="none" stroke="#FFB020" stroke-width="2.4"/><path d="M13 14h14M20 14v13" fill="none" stroke="#FFB020" stroke-width="2.6" stroke-linecap="square"/><path d="M15 27h10" fill="none" stroke="#17C3B2" stroke-width="2.2"/></svg></span></div>
  <div class="boot-txt">Dispatch sync</div>
</div></div>

<div class="app">
  <header id="hdr"></header>
  <main class="main">
    <div class="rise rise-1" style="margin-bottom:16px">
      <span style="font-size:10px;font-weight:800;letter-spacing:.18em;text-transform:uppercase;color:var(--pink);display:block">Wallet</span>
      <h1>Fund Your Account</h1>
    </div>

    <div class="bal-strip rise rise-2">
      <div><div class="k">Available balance</div><div class="v" id="bal">₦0</div></div>
      <a class="btn btn--sm" style="background:rgba(255,255,255,.2);color:#fff" href="transactions.html">History</a>
    </div>

    <div class="rise rise-3" style="margin-bottom:16px" id="bank"></div>

    <div class="alert alert--info show rise rise-3" style="margin-bottom:16px">
      <svg viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="12" r="9.5" fill="none" stroke="currentColor" stroke-width="2.2"/><path d="M12 11v6m0-9.5v.5" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>
      <span>Transfer exactly the amount you enter using the details above, then submit the form. Deposits are confirmed by our team and credited to your wallet.</span>
    </div>

    <div class="card rise rise-4" style="margin-bottom:16px">
      <h3 style="margin-bottom:14px">Confirm your transfer</h3>
      <div class="alert" id="alert" role="status" aria-live="polite"></div>
      <div class="quick-amts" id="quick"></div>
      <form id="depForm">
        <div class="field-row">
          <label class="label" for="amt">Amount (₦)</label>
          <div class="input-wrap">
            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M3 7a2 2 0 0 1 2-2h13v3H5a2 2 0 0 1-2-1zm0 1v10a2 2 0 0 0 2 2h15V8H5a2 2 0 0 1-2-1zm13 4h3v4h-3a2 2 0 0 1 0-4z"/></svg>
            <input class="input" id="amt" type="number" inputmode="numeric" placeholder="0" required>
          </div>
          <p class="hint" id="limits"></p>
        </div>
        <div class="field-row">
          <label class="label" for="senderName">Sender name <span class="opt">(optional)</span></label>
          <div class="input-wrap">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg>
            <input class="input" id="senderName" maxlength="80" autocomplete="name" placeholder="Name used to send the transfer">
          </div>
        </div>
        <button class="btn btn--blue btn--block" type="submit">Submit deposit</button>
      </form>
    </div>

    <div class="card rise rise-5">
      <h3 style="margin-bottom:6px">Your deposit requests</h3>
      <div class="rows" id="recent"></div>
    </div>
  </main>
  <nav id="nav"></nav>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="assets/js/config.js?v=4"></script>
<script src="assets/js/store.js?v=5"></script>
<script src="assets/js/app.js?v=6"></script>
<script src="assets/js/actions.js?v=3"></script>
<script src="assets/js/money.js?v=3"></script>
</body>
</html>
