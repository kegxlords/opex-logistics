<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Support · Tranex</title>
<meta name="theme-color" content="#0F1216">
<meta name="description" content="Tranex customer care — WhatsApp, Telegram, FAQ and support tickets.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/theme.css?v=4">
<link rel="stylesheet" href="assets/css/layout.css?v=4">
<link rel="stylesheet" href="assets/css/components.css?v=4">
<style>
  .faq-item{border-bottom:1px solid var(--hairline)}
  .faq-item:last-child{border-bottom:0}
  .faq-q{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:15px 0;font-size:13.5px;font-weight:800;color:var(--body)}
  .faq-q svg{width:16px;height:16px;color:var(--blue);flex-shrink:0;transition:transform var(--t-mid) var(--e-out)}
  .faq-item.open .faq-q svg{transform:rotate(90deg);color:var(--pink)}
  .faq-a{max-height:0;overflow:hidden;transition:max-height var(--t-mid) var(--e-out)}
  .faq-a p{padding:0 0 15px 28px;font-size:12.5px;font-weight:600;color:var(--muted);line-height:1.6}
  .ticket{padding:14px;border-radius:var(--r-md);background:var(--ground);border:1px solid var(--hairline);margin-bottom:10px}
  .ticket b{font-size:13.5px;font-weight:800;display:block}
  .ticket .msg{font-size:12.5px;font-weight:600;color:var(--muted);margin-top:5px;line-height:1.5}
  .ticket .reply{margin-top:10px;padding:11px 13px;border-radius:var(--r-sm);background:var(--green-tint);border:1px solid rgba(20,168,103,.24);font-size:12.5px;font-weight:600;color:var(--green-deep);line-height:1.5}
  .care-stat{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:16px}
  .care-stat div{padding:14px 8px;border-radius:var(--r-md);text-align:center;background:var(--surface);border:1px solid var(--hairline);box-shadow:var(--sh-1)}
  .care-stat b{font-family:var(--font-display);font-size:17px;font-weight:800;display:block;letter-spacing:-.02em}
  .care-stat span{font-size:9.5px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;color:var(--muted-2)}
</style>
<link rel="stylesheet" href="assets/css/tranex.css?v=2">
</head>
<body data-page="support">
<div class="boot" id="boot"><div class="boot-in">
  <div class="boot-ring"><span class="crest-mark"><svg viewBox="0 0 40 40" role="img" aria-label="Tranex dispatch mark"><path d="M8 8h24v24H8z" fill="none" stroke="#FFB020" stroke-width="2.4"/><path d="M13 14h14M20 14v13" fill="none" stroke="#FFB020" stroke-width="2.6" stroke-linecap="square"/><path d="M15 27h10" fill="none" stroke="#17C3B2" stroke-width="2.2"/></svg></span></div>
  <div class="boot-txt">Dispatch sync</div>
</div></div>

<div class="app">
  <header id="hdr"></header>
  <main class="main">
    <div class="rise rise-1" style="margin-bottom:16px">
      <span style="font-size:10px;font-weight:800;letter-spacing:.18em;text-transform:uppercase;color:var(--pink);display:block">We are here to help</span>
      <h1>Customer Care</h1>
    </div>

    <div class="care-stat rise rise-2">
      <div><b class="c-green">&lt; 5 min</b><span>Typical reply</span></div>
      <div><b class="c-blue">7 days</b><span>Coverage</span></div>
      <div><b class="c-pink" id="openCount">0</b><span>Your open tickets</span></div>
    </div>

    <div class="card rise rise-3" style="margin-bottom:16px">
      <h3 style="margin-bottom:12px">Reach us directly</h3>
      <div class="welcome-actions" id="channels"></div>
    </div>

    <div class="card rise rise-4" style="margin-bottom:16px">
      <h3 style="margin-bottom:6px">Frequently asked</h3>
      <div id="faq"></div>
    </div>

    <div class="card rise rise-5" style="margin-bottom:16px">
      <h3 style="margin-bottom:14px">Open a ticket</h3>
      <div class="alert" id="alert" role="status" aria-live="polite"></div>
      <form id="tForm">
        <div class="field-row"><label class="label" for="cat">Category</label>
          <div class="input-wrap">
            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M3 7h18v4a2 2 0 0 0 0 4v4H3v-4a2 2 0 0 0 0-4zm6 1v8" fill="none" stroke="currentColor" stroke-width="2"/></svg>
            <select class="input" id="cat" required>
              <option>Deposit not credited</option><option>Withdrawal delay</option>
              <option>Lease or income question</option><option>Payout card issue</option>
              <option>Referral commission</option><option>Account access</option><option>Something else</option>
            </select></div></div>
        <div class="field-row"><label class="label" for="subj">Subject</label>
          <div class="input-wrap">
            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M4 6h16M4 12h16M4 18h10" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
            <input class="input" id="subj" placeholder="Short summary" required></div></div>
        <div class="field-row"><label class="label" for="msg">Message</label>
          <div class="input-wrap" style="align-items:flex-start;padding-top:12px">
            <textarea class="input" id="msg" placeholder="Describe what happened, with any reference numbers" required></textarea></div></div>
        <button class="btn btn--blue btn--block" type="submit">Submit ticket</button>
      </form>
    </div>

    <div class="card rise rise-6">
      <h3 style="margin-bottom:12px">Your tickets</h3>
      <div id="tickets"></div>
    </div>
  </main>
  <nav id="nav"></nav>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="assets/js/config.js?v=4"></script>
<script src="assets/js/store.js?v=5"></script>
<script src="assets/js/app.js?v=6"></script>
<script src="assets/js/actions.js?v=3"></script>
<script src="assets/js/support.js?v=3"></script>
</body>
</html>
