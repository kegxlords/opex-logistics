<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>My Team · Tranex</title>
<meta name="theme-color" content="#0F1216">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/theme.css?v=4">
<link rel="stylesheet" href="assets/css/layout.css?v=4">
<link rel="stylesheet" href="assets/css/components.css?v=4">
<style>
  .tot-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:16px}
  @media(min-width:640px){.tot-grid{grid-template-columns:repeat(4,1fr)}}
  .tot{padding:16px 10px;border-radius:var(--r-md);text-align:center;background:var(--surface);border:1px solid var(--hairline);box-shadow:var(--sh-1)}
  .tot .v{font-family:var(--font-display);font-size:24px;font-weight:800;letter-spacing:-.03em}
  .tot .k{font-size:9.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted-2);margin-top:2px}
  .tabs{display:flex;gap:6px;background:var(--surface);border:1px solid var(--hairline);border-radius:var(--r-md);padding:5px;margin-bottom:16px;box-shadow:var(--sh-1)}
  .tabs button{flex:1;padding:11px 6px;border-radius:var(--r-sm);font-family:var(--font-display);font-size:12.5px;font-weight:800;color:var(--muted);transition:all var(--t-fast)}
  .tabs button.on{background:var(--g-blue);color:#fff;box-shadow:var(--sh-blue)}
  .member{display:flex;align-items:center;gap:12px;padding:13px 0;border-bottom:1px solid var(--hairline)}
  .member:last-child{border-bottom:0}
  .avatar{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;font-family:var(--font-display);font-weight:800;font-size:15px;color:#fff;flex-shrink:0}
  .toolbar{display:flex;gap:9px;margin-bottom:12px}
  .toolbar .input-wrap{flex:1}
</style>
<link rel="stylesheet" href="assets/css/tranex.css?v=4">
</head>
<body data-page="team">
<div class="boot" id="boot"><div class="boot-in">
  <div class="boot-ring"><span class="crest-mark"><svg viewBox="0 0 40 40" role="img" aria-label="Tranex dispatch mark"><path d="M8 8h24v24H8z" fill="none" stroke="#FFB020" stroke-width="2.4"/><path d="M13 14h14M20 14v13" fill="none" stroke="#FFB020" stroke-width="2.6" stroke-linecap="square"/><path d="M15 27h10" fill="none" stroke="#17C3B2" stroke-width="2.2"/></svg></span></div>
  <div class="boot-txt">Dispatch sync</div>
</div></div>

<div class="app">
  <header id="hdr"></header>
  <main class="main">
    <div class="rise rise-1" style="margin-bottom:16px">
      <span style="font-size:10px;font-weight:800;letter-spacing:.18em;text-transform:uppercase;color:var(--pink);display:block">Three-level network</span>
      <h1>My Team</h1>
    </div>

    <div class="tot-grid rise rise-2" id="totals"></div>

    <div class="card rise rise-3" style="margin-bottom:16px">
      <div class="ref-box">
        <input id="link" readonly value="">
        <button class="btn btn--primary btn--sm" type="button" id="copy">Copy</button>
      </div>
      <a class="btn btn--ghost btn--sm btn--block" href="refer.html" style="margin-top:10px">Referral tools &amp; QR</a>
    </div>

    <div class="tabs rise rise-4" id="tabs"></div>

    <div class="toolbar rise rise-4">
      <div class="input-wrap">
        <svg viewBox="0 0 24 24" fill="currentColor"><circle cx="11" cy="11" r="7" fill="none" stroke="currentColor" stroke-width="2"/><path d="M16.5 16.5L21 21" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        <input class="input" id="search" placeholder="Search members">
      </div>
      <select class="input" id="sort" style="max-width:130px;background:var(--surface);border:1.5px solid var(--hairline);border-radius:var(--r-md);padding:0 12px;font-weight:700">
        <option value="new">Newest</option>
        <option value="funded">Top funded</option>
        <option value="name">Name A–Z</option>
      </select>
    </div>

    <div class="card rise rise-5"><div id="list"></div></div>
  </main>
  <nav id="nav"></nav>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="assets/js/config.js?v=4"></script>
<script src="assets/js/store.js?v=5"></script>
<script src="assets/js/app.js?v=6"></script>
<script src="assets/js/actions.js?v=3"></script>
<script src="assets/js/qr.js?v=3"></script>
<script src="assets/js/network.js?v=4"></script>
</body>
</html>
